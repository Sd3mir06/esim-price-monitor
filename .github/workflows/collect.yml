name: eSIM daily price collection

# Runs the collector every day, rebuilds the dashboard, and commits the
# results back into the repo. GitHub Pages then serves docs/index.html.
on:
  schedule:
    # Runs DAILY 06:00 UTC but a gate (should_collect.py) only actually collects on
    # Mondays (weekly baseline) OR within 7 days before/through an event (close
    # monitoring). Other days it exits early — cheap no-op.
    - cron: "0 6 * * *"
  workflow_dispatch: {}       # manual "Run workflow" always collects

permissions:
  contents: write             # needed to commit the new data back

concurrency:
  group: esim-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
        # NOTE: collect.py uses ONLY the Python standard library —
        # there is nothing to `pip install`.

      - name: Decide whether to collect (Monday or near an event)
        id: gate
        run: python3 should_collect.py

      - name: Collect competitor prices
        if: steps.gate.outputs.run == 'true'
        run: python3 collect.py

      - name: Build dashboard + history
        if: steps.gate.outputs.run == 'true'
        run: |
          python3 build_dashboard.py     # -> docs/index.html
          python3 build_history.py       # -> docs/history.json (all dated CSVs)

      - name: Commit results back to the repo
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name  "esim-price-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data docs
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "prices: $(date -u +%F)"
            git push
          fi
